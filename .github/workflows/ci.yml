name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch supersedes a running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-audit:
    name: Build, test, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CSharpApp.slnx

      - name: Build (Release)
        run: dotnet build CSharpApp.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test CSharpApp.slnx --no-build --configuration Release

      - name: Build the container image
        run: |
          docker compose config -q
          docker build -t csharpapp:ci .

      # Liveness answers for the process alone, so a broken image fails here rather than on a reviewer's machine.
      - name: Smoke the container
        run: |
          docker run -d --name ci-smoke -p 8080:8080 csharpapp:ci
          curl -fsS --retry 20 --retry-delay 1 --retry-all-errors http://localhost:8080/health/live \
            || { docker logs ci-smoke; exit 1; }

      - name: Audit packages for known vulnerabilities
        run: |
          dotnet list CSharpApp.slnx package --vulnerable --include-transitive | tee vulnerable-packages.txt
          if grep -q "has the following vulnerable packages" vulnerable-packages.txt; then
            echo "::error::Known-vulnerable packages found, see the audit output above."
            exit 1
          fi
