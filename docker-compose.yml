services:
  api:
    build: .
    image: csharpapp
    # Loopback only: an unauthenticated proxy holding the server's upstream credentials, whose POST writes
    # real records upstream, has no business on every interface.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # Overridable per deployment without rebuilding; the defaults are the sandbox's published demo account,
      # so that "docker compose up" works with no setup.
      RestApiSettings__Username: ${PLATZI_USERNAME:-john@mail.com}
      RestApiSettings__Password: ${PLATZI_PASSWORD:-changeme}
    # Verified that the full upstream round-trip still works with all of this applied.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # The runtime sizes its heaps against everything it can see, and the failure the image's init guards
    # against is a process pinning a core.
    cpus: "1.0"
    mem_limit: 512m
    restart: unless-stopped
